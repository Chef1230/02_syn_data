# Config 6: 6,500 databases and exactly 13,000 tasks.
# This file intentionally contains only experiment overrides; the remaining
# fields are inherited from configs/template.yaml by the config loader.
config_version: 1
seed: 42

paths:
  output_root: outputs/config6_6500db_13000task

generation:
  num_schemas: 6500
  start_index: 0
  sample_id_prefix: sample
  progress_every: 100
  overwrite: false
  project_version: schema-pipeline-v6

# Keep the real-data-oriented graph density from the template while retaining
# the full motif vocabulary, including collider and fork structures.
schema:
  extra_edge_probability: 0.35
  background_attachment_probability: 0.35

motifs:
  weights:
    entity_event: 1.00
    entity_event_detail: 1.25
    entity_bridge_collider: 1.00
    entity_event_collider: 1.00
    entity_event_fork: 1.00
    event_reference_chain: 0.80
    lookup_assignment: 0.90

instance:
  # Keep the heavy-tailed role-conditioned scale, but use the current
  # bounded production limits so the 6,500-DB run remains reproducible.
  entity_rows_min: 100
  entity_rows_max: 20000
  entity_rows_distribution: lognormal
  entity_rows_median: 1500
  entity_rows_log_sigma: 1.15
  lookup_rows_min: 3
  lookup_rows_max: 200
  lookup_rows_distribution: loguniform
  event_fanout_min: 0.10
  event_fanout_max: 30.0
  bridge_rows_factor_min: 0.05
  bridge_rows_factor_max: 8.0
  detail_fanout_min: 0.20
  detail_fanout_max: 12.0
  entity_child_factor_min: 0.15
  entity_child_factor_max: 3.0
  population_scale_distribution: lognormal
  population_scale_log_sigma: 1.0
  max_rows_per_table: 50000

  optional_rate_min: 0.0
  optional_rate_max: 0.40

  # A lower high-cardinality tail than the broad template default, centered
  # around the low-cardinality regime used by RDBPFN-style inputs.
  categorical_cardinality_min: 2
  categorical_cardinality_max: 16
  categorical_high_cardinality_probability: 0.08
  categorical_high_cardinality_min: 17
  categorical_high_cardinality_max: 512

  # Local override of the template defaults.  Current code uses these for the
  # Softmax(signal logits + log Dirichlet prior) categorical path.
  categorical_dirichlet_alpha_min: 0.25
  categorical_dirichlet_alpha_max: 2.00
  categorical_signal_strength_min: 0.75
  categorical_signal_strength_max: 1.75

  # Balanced calendar mechanisms; churn remains visible without making every
  # event table look like a benchmark-specific churn generator.
  event_temporal_mechanism_weights:
    stationary: 0.25
    burst: 0.30
    churn: 0.30
    seasonal: 0.15

instance_generation:
  count: null
  start_index: 0
  shard_id: 0
  num_shards: 1
  num_workers: 8
  progress_every: 100
  overwrite: false
  project_version: instance-pipeline-v6

task:
  tasks_per_database: 2
  # Sum is 1.0.  The two history-gated mechanisms receive enough mass to
  # expose churn/retention behavior while relation and aggregate tasks remain
  # the majority of the task family.
  mechanism_weights:
    relation_attribute: 0.30
    entity_future_event_existence: 0.20
    history_gated_future_inactive: 0.15
    history_gated_future_active: 0.10
    future_event_attribute_condition: 0.15
    temporal_relational_aggregate: 0.10

  support_fraction: 0.70
  min_support_rows: 32
  min_query_rows: 16
  min_class_count_per_split: 2
  max_classification_categories: 12
  cutoff_quantile_min: 0.40
  cutoff_quantile_max: 0.72
  horizon_fraction_min: 0.08
  horizon_fraction_max: 0.25
  positive_rate_min: 0.20
  positive_rate_max: 0.80
  max_attempts_per_database: 192
  require_full_task_count: true

task_generation:
  database_count: null
  start_index: 0
  shard_id: 0
  num_shards: 1
  progress_every: 100
  overwrite: false
  project_version: task-pipeline-v6

rdbpfn_export:
  task_count: null
  start_index: 0
  shard_id: 0
  num_shards: 1
  validation_fraction: 0.20
  min_validation_rows: 8
  compress: true
  progress_every: 100
  overwrite: false
  project_version: rdbpfn-export-v6

  # Keep H5/DFS packaging opt-in for this generation run.  When enabled, use
  # DFS-2 explicitly; the current exporter does not mix DFS-1 and DFS-2 in one
  # H5 artifact.
  h5_enabled: false
  h5_run_dfs: true
  dfs_depth: 2
  dfs_jobs: 24
  h5_total_rows: 600
  h5_max_columns: 60
  h5_seed: 42
